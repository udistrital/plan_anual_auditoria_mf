<plantilla-modal
  [icono]="'send'"
  [titulo]="'Enviar a Aprobación'"
  [descripcion]="'Enviar la auditoría al Jefe para su aprobación'"
  [contenido]="contenidoDeModal"
  [homologado]="homologado"
></plantilla-modal>

<ng-template #contenidoDeModal>
  <!-- Pregunta de confirmación: siempre visible, encima de la observación -->
  <p class="pregunta-envio">
    <mat-icon color="primary">info</mat-icon>
    <span>{{ preguntaConfirmacion }}</span>
  </p>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="campo-observacion" subscriptSizing="dynamic">
      <mat-label>Observación (opcional)</mat-label>
      <mat-icon color="primary" matPrefix>comment</mat-icon>
      <textarea
        style="height: 96px; resize: none"
        matInput
        formControlName="observacion"
        placeholder="Ingrese una observación opcional para el Jefe..."
      ></textarea>
    </mat-form-field>
  </form>

  <mat-dialog-actions align="center" class="acciones-envio">
    <button
      mat-stroked-button
      color="primary"
      style="border: 1px solid var(--md-primary-500)"
      [mat-dialog-close]="null"
    >
      <mat-icon>close</mat-icon>Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="confirmar()"
    >
      <mat-icon>send</mat-icon>Sí, enviar
    </button>
  </mat-dialog-actions>
</ng-template>
