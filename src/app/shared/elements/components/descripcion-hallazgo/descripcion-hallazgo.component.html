@switch (estado()) {
  @case ('cargando') {
    <span class="descripcion-estado">Cargando descripción...</span>
  }
  @case ('error') {
    <div class="descripcion-no-disponible" role="alert">
      <mat-icon>cloud_off</mat-icon>
      <span>Descripción no disponible: no se pudo cargar desde el gestor documental.</span>
    </div>
  }
  @case ('vacia') {
    <span class="descripcion-estado">—</span>
  }
  @default {
    <!--
      [sanitize]="false" conserva las imágenes en base64 y sus atributos de tamaño; con "true",
      ngx-quill pasa el HTML a [innerHTML] y el sanitizador de Angular elimina el `src` data: y el
      `style`, y las imágenes no cargan. El contenido proviene del propio gestor documental y del
      editor de la aplicación, por lo que se considera de confianza.
    -->
    <quill-view-html class="descripcion-contenido" [content]="html()" [sanitize]="false"></quill-view-html>
  }
}
