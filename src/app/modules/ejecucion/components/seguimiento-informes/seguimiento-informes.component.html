<plantilla-tarjeta-contenedora [title]="'Seguimiento e Informes'"
  [breadcrumb]="'<p>Gestión Auditoría / Ejecución / <b>Seguimiento e Informes</b></p>'"
  [contenido]="contenidoDePlantilla" [homologada]="true">
</plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="row">
    <div class="col-12">
      <form [formGroup]="vigenciaForm" class="sui-seccion">
        <div class="sui-fila">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" style="width: 320px; max-width: 100%">
            <mat-label>Seleccione una vigencia:</mat-label>
            <mat-icon color="primary" matPrefix>today</mat-icon>
            <mat-select formControlName="vigencia" (selectionChange)="mostrarSeguimientosPorVigencia($event.value)"
              color="primary">
              <mat-option disabled value="">--Seleccionar--</mat-option>
              @for (vigencia of vigencias; track vigencia) {
                <mat-option [value]="vigencia">{{ vigencia.Nombre }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
          <!-- Nota informativa: solo el ícono, el texto aparece al pasar el mouse -->
          <mat-icon
            class="sui-info-tip"
            tabindex="0"
            matTooltip="Se cargarán los seguimientos e informes correspondientes a la vigencia seleccionada."
            aria-label="Se cargarán los seguimientos e informes correspondientes a la vigencia seleccionada."
            aria-hidden="false"
            >info</mat-icon>
        </div>
      </form>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabla-seguimientos [vigenciaId]="vigenciaSeleccionada"></app-tabla-seguimientos>
    </div>
  </div>
</ng-template>
