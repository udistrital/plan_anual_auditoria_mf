<plantilla-tarjeta-contenedora [title]="'Ver Documentos'" [breadcrumb]="
    '<p>Gestión Auditoría / Ejecución / Seguimiento de Informes / <b>Ver Documentos</b></p>'
  " [contenido]="contenidoDePlantilla" (regresar)="regresarRuta()"
[mostrarBotonRegresar]="true" [homologada]="true"></plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="row mt-3">
    <div class="col-12">
      <div class="row g-4">
        <div class="col-sm-12 col-md-5 col-lg-4">
          <div class="d-flex flex-column sui-panel-documentos documentos-panel">
            <!-- Encabezado del panel: título y Descargar Todo -->
            <div class="cabecera-documentos">
              <h3 class="sui-seccion-titulo">Documentos</h3>
              <button mat-stroked-button color="primary" (click)="descargarTodo()">
                <mat-icon>file_download</mat-icon> Descargar Todo
              </button>
            </div>
            <div class="documentos-scroll d-flex flex-column sui-lista-documentos">
              @for (doc of opcionesDocumentos; track doc; let i = $index) {
                <button class="custom-button" mat-stroked-button [ngClass]="selectedTab === i ? 'selected' : ''"
                  (click)="selectTab(i)">
                  <mat-icon>picture_as_pdf</mat-icon>
                  {{ doc.nombre }}
                </button>
              }
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-7 col-lg-8 mt-md">
          <div class="sui-panel-visor">
            @for (doc of opcionesDocumentos; track doc; let i = $index) {
              @if (selectedTab === i) {
                <div class="sui-cabecera-visor">
                  <h3 class="sui-seccion-titulo">{{ doc.nombre }}</h3>
                </div>
                <div class="sui-visor">
                  <app-pdf-visualizador
                    [base64Document]="doc.base64"
                    [herramientas]="true"
                    [nombreArchivo]="doc.nombre"
                  ></app-pdf-visualizador>
                </div>
              }
            }
          </div>
        </div>
      </div>

      @if (role) {
        @if (mostrarAcciones()) {
          <div class="sui-barra-acciones">
            <button mat-stroked-button color="primary" (click)="abrirModalRechazo()">
              <mat-icon>disabled_by_default</mat-icon>{{ rolesAprobacion[role]?.botonRechazo ?? "Rechazar Informe" }}
            </button>
            <button mat-raised-button color="primary" (click)="preguntarAprobacion()">
              <mat-icon>fact_check</mat-icon>
              {{ rolesAprobacion[role]?.botonAprobacion ?? '' }}
            </button>
          </div>
        }
      }

    </div>
  </div>
</ng-template>
