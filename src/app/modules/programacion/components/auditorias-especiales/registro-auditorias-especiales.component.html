<plantilla-tarjeta-contenedora
  [title]="'Registro Auditorías Especiales'"
  [breadcrumb]="
    '<p>Gestión Auditoría / Programación /  <b>Registro Auditorías Especiales</b></p>'
  "
  [contenido]="contenidoDePlantilla"
  [homologada]="true"
></plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="sui-seccion">
    <form [formGroup]="vigenciaForm" class="d-flex flex-wrap justify-content-between align-items-center" style="gap: 16px">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" style="width: 320px; max-width: 100%">
        <mat-label>Seleccione una vigencia: </mat-label>
        <mat-icon color="primary" matPrefix>today</mat-icon>
        <mat-select
          formControlName="vigencia"
          (selectionChange)="mostrarAuditoriasPorVigencia($event.value)"
          track vigencia
          >
          <mat-option disabled value="">--Seleccionar--</mat-option>
          @for (vigencia of vigencias; track vigencia) {
            <mat-option [value]="vigencia">
              {{ vigencia.Nombre }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
      @if (permiso) {
        <button
          mat-raised-button
          color="primary"
          (click)="nuevaAuditoria()"
          >
          <mat-icon>add_circle</mat-icon>
          Crear Auditoría Especial
        </button>
      }
    </form>
    <p class="sui-subtitulo mt-3 mb-0">Seleccione el año de auditoría especial a realizar</p>
  </div>

  <div>
    <div>
      <app-tabla-auditorias-especiales
        [vigenciaId]="vigenciaSeleccionada"
        [permiso]="permiso"
        [usuarioId]="usuarioId"
        [usuarioRol]="usuarioRol"
      ></app-tabla-auditorias-especiales>
    </div>
  </div>

</ng-template>
