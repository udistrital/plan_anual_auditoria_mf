<plantilla-modal
  [homologado]="true"
  [icono]="'list_alt'"
  [titulo]="'Ver PAA'"
  [descripcion]="data.actualizado ? 'Plan Anual de Auditoria actualizado' : 'Plan Anual de Auditoria'"
  [contenido]="contenidoDeModal"
></plantilla-modal>

<ng-template #contenidoDeModal>
  <div class="sui-visor mt-3">
    <app-pdf-visualizador
      [base64Document]="data.base64Document"
      [herramientas]="true"
      [nombreArchivo]="'Plan Anual de Auditoria ' + data.vigenciaNombre"
    ></app-pdf-visualizador>
  </div>
</ng-template>
