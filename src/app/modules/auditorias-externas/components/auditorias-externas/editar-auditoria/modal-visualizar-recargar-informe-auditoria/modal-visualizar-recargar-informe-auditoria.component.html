<plantilla-modal
  [icono]="'list_alt'"
  [titulo]="'Ver Informe Final'"
  [descripcion]="(data.nombre || 'Informe final de la auditoría externa') + (data.tamanio ? ' · ' + data.tamanio : '')"
  [contenido]="contenidoDeModal"
  [footer]="footerDeModal"
  [homologado]="true"
></plantilla-modal>

<ng-template #contenidoDeModal>
  <div class="row">
    <div class="col-12">
      <app-pdf-visualizador [base64Document]="data.base64Document" [herramientas]="true" [nombreArchivo]="data.nombre || 'Informe Auditoría'"></app-pdf-visualizador>
    </div>
  </div>
</ng-template>

<ng-template #footerDeModal>
  <button mat-stroked-button color="warn" (click)="quitarDocumento()">
    <mat-icon>delete</mat-icon>
    Quitar
  </button>
  <button mat-raised-button color="primary" (click)="cambiarDocumento()">
    <mat-icon>file_upload</mat-icon>
    Cambiar archivo
  </button>
</ng-template>
