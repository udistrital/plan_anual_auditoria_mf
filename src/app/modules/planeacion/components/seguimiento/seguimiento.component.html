<plantilla-tarjeta-contenedora
  [title]="'Planeación de Seguimientos e Informes de Ley'"
  [breadcrumb]="
    '<p>Gestión de Auditoría / Planeación / <b>Seguimientos e Informes de Ley</b></p>'
  "
  [contenido]="contenidoDePlantilla"
  [homologada]="true"
></plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="row">
    <div class="col-12">
      <form [formGroup]="vigenciaForm" class="sui-seccion">
        <div class="sui-fila">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" style="width: 320px; max-width: 100%">
            <mat-label>Seleccione una vigencia:</mat-label>
            <mat-icon color="primary" matPrefix>today</mat-icon>
            <mat-select
              formControlName="vigencia"
              (selectionChange)="mostrarAuditoriasPorVigencia($event.value)"
              color="primary"
              >
              <mat-option disabled value="">--Seleccionar--</mat-option>
              @for (vigencia of vigencias; track vigencia) {
                <mat-option
                  [value]="vigencia"
                  >{{ vigencia.Nombre }}</mat-option
                  >
                }
              </mat-select>
            </mat-form-field>
            <!-- Nota informativa: solo el ícono, el texto aparece al pasar el mouse -->
            <mat-icon
              class="sui-info-tip"
              tabindex="0"
              matTooltip="Se cargarán las auditorías correspondientes a la vigencia seleccionada."
              aria-label="Se cargarán las auditorías correspondientes a la vigencia seleccionada."
              aria-hidden="false"
              >info</mat-icon>
          </div>
        </form>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <app-tabla-seguimiento
          [vigenciaId]="vigenciaSeleccionada"
        ></app-tabla-seguimiento>
      </div>
    </div>
  </ng-template>
